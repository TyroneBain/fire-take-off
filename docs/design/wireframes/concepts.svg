<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Three alternative layout concepts</title><desc id="desc">Original static proposal. Fictional project and quantities. Future capabilities are not implemented.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#101419" stroke="none" stroke-width="1"/><text x="24" y="30" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Three competing interface architectures</text><text x="24" y="53" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">DESIGN PROPOSAL  /  Fictional data  /  Layout and new interactions await approval</text><text x="24" y="107" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">A / Drawing + inspector</text><text x="24" y="134" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Separate navigation, drawing and quantities</text><rect x="24" y="160" width="448" height="430" rx="8" fill="#E7EAEE" stroke="none" stroke-width="1"/><rect x="24" y="160" width="448" height="44" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="36" y="188" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Identity · Search · Save · Export</text><rect x="24" y="204" width="448" height="36" rx="0" fill="#2C333E" stroke="none" stroke-width="1"/><text x="36" y="227" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Select  Count  Measure  Zone  Note  Layout</text><rect x="24" y="240" width="84" height="322" rx="0" fill="#222831" stroke="none" stroke-width="1"/><rect x="372" y="240" width="100" height="322" rx="0" fill="#222831" stroke="none" stroke-width="1"/><text x="32" y="268" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Drawings</text><text x="32" y="293" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Zones</text><text x="381" y="268" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Scope</text><text x="381" y="293" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Items</text><text x="381" y="318" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Review</text><text x="381" y="343" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Properties</text><text x="167" y="401" fill="#404854" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">DRAWING</text><rect x="24" y="562" width="448" height="28" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="36" y="581" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Scale · View status · Results</text><text x="24" y="630" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Best: simultaneous sheet and quantity context.</text><text x="24" y="668" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Risk: two panels consume laptop width.</text><text x="24" y="706" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Laptop: collapse navigator; keep scope visible.</text><text x="24" y="744" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Large screen: both panels + optional ledger.</text><text x="24" y="782" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Recommendation: test first; do not assume winner.</text><text x="496" y="107" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">B / Single-side workbench</text><text x="496" y="134" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">One work panel; more drawing width</text><rect x="496" y="160" width="448" height="430" rx="8" fill="#E7EAEE" stroke="none" stroke-width="1"/><rect x="496" y="160" width="448" height="44" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="508" y="188" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Identity · Search · Save · Export</text><rect x="496" y="204" width="32" height="358" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><rect x="528" y="204" width="128" height="358" rx="0" fill="#222831" stroke="none" stroke-width="1"/><text x="539" y="237" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Tools</text><text x="539" y="272" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Sheets</text><text x="539" y="307" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Items</text><text x="539" y="342" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Review</text><text x="539" y="377" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Zones</text><text x="539" y="412" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Properties</text><text x="720" y="401" fill="#404854" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">DRAWING</text><rect x="496" y="562" width="448" height="28" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="508" y="581" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Scale · View status · Results</text><text x="496" y="630" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Best: compact work area and short pointer travel.</text><text x="496" y="668" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Risk: sheets compete with review/properties.</text><text x="496" y="706" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Laptop: one 320px panel + narrow tool rail.</text><text x="496" y="744" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Large screen: more canvas, still list switching.</text><text x="496" y="782" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Strong fallback if A loses on task performance.</text><text x="968" y="107" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">C / Review-led workspace</text><text x="968" y="134" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Issue queue and persistent evidence ledger</text><rect x="968" y="160" width="448" height="430" rx="8" fill="#E7EAEE" stroke="none" stroke-width="1"/><rect x="968" y="160" width="448" height="44" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="980" y="188" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Identity · Search · Save · Export</text><rect x="968" y="204" width="448" height="36" rx="0" fill="#2C333E" stroke="none" stroke-width="1"/><text x="980" y="227" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Takeoff   /   Review   /   Reconcile</text><rect x="968" y="240" width="104" height="220" rx="0" fill="#222831" stroke="none" stroke-width="1"/><text x="980" y="268" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Task queue</text><text x="1148" y="350" fill="#404854" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">DRAWING</text><rect x="968" y="460" width="448" height="102" rx="0" fill="#222831" stroke="none" stroke-width="1"/><text x="982" y="490" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Evidence + quantities ledger</text><rect x="968" y="562" width="448" height="28" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="980" y="581" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400">Scale · View status · Results</text><text x="968" y="630" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Best: checking, issue resolution and reconciliation.</text><text x="968" y="668" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Risk: more modes; reduced drawing height.</text><text x="968" y="706" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Laptop: queue or properties, not both.</text><text x="968" y="744" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Large screen: persistent ledger earns its space.</text><text x="968" y="782" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Consider as a later review mode, not default.</text><text x="24" y="888" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">All three concepts preserve direct drawing interaction. These are layout hypotheses, not measured productivity results.</text></svg>