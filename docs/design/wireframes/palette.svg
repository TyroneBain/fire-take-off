<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Palette alternatives and independent states</title><desc id="desc">Original static proposal. Fictional project and quantities. Future capabilities are not implemented.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#101419" stroke="none" stroke-width="1"/><text x="24" y="30" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Visual system study — accent is separate from meaning</text><text x="24" y="53" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">DESIGN PROPOSAL  /  Fictional data  /  Layout and new interactions await approval</text><rect x="24" y="100" width="448" height="225" rx="8" fill="#222831" stroke="none" stroke-width="1"/><text x="44" y="134" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Amber primary action</text><rect x="44" y="160" width="210" height="40" rx="6" fill="#E3A34D" stroke="none" stroke-width="1"/><text x="60" y="186" fill="#191D23" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Run count</text><text x="44" y="229" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Dark label contrast: 7.74:1</text><text x="44" y="264" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Same layout and states for fair comparison.</text><text x="44" y="294" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Candidate — no user preference result yet.</text><rect x="496" y="100" width="448" height="225" rx="8" fill="#222831" stroke="none" stroke-width="1"/><text x="516" y="134" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Blue primary action</text><rect x="516" y="160" width="210" height="40" rx="6" fill="#90B8FF" stroke="none" stroke-width="1"/><text x="532" y="186" fill="#191D23" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Run count</text><text x="516" y="229" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Dark label contrast: 8.45:1</text><text x="516" y="264" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Same layout and states for fair comparison.</text><text x="516" y="294" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Candidate — no user preference result yet.</text><rect x="968" y="100" width="448" height="225" rx="8" fill="#222831" stroke="none" stroke-width="1"/><text x="988" y="134" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">Teal primary action</text><rect x="988" y="160" width="210" height="40" rx="6" fill="#75CBC1" stroke="none" stroke-width="1"/><text x="1004" y="186" fill="#191D23" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Run count</text><text x="988" y="229" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Dark label contrast: 8.92:1</text><text x="988" y="264" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Same layout and states for fair comparison.</text><text x="988" y="294" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Candidate — no user preference result yet.</text><text x="24" y="373" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">State vocabulary must survive monochrome and theme changes</text><rect x="24" y="405" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="417" width="20" height="20" rx="3" fill="#E3A34D" stroke="none" stroke-width="1"/><text x="80" y="434" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Primary action</text><text x="370" y="434" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Amber fill + dark verb label</text><rect x="24" y="459" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="471" width="20" height="20" rx="3" fill="#90B8FF" stroke="none" stroke-width="1"/><text x="80" y="488" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Active tool / selection</text><text x="370" y="488" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Blue keyline + visible tool name</text><rect x="24" y="513" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="525" width="20" height="20" rx="3" fill="#007D7A" stroke="none" stroke-width="1"/><text x="80" y="542" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Category on paper</text><text x="370" y="542" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Named category + stroke/marker pattern</text><rect x="24" y="567" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="579" width="20" height="20" rx="3" fill="#90B8FF" stroke="none" stroke-width="1"/><text x="80" y="596" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Unreviewed</text><text x="370" y="596" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Open diamond + Unreviewed label</text><rect x="24" y="621" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="633" width="20" height="20" rx="3" fill="#7BC8A4" stroke="none" stroke-width="1"/><text x="80" y="650" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Reviewed</text><text x="370" y="650" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Check + Reviewed label, not Verified</text><rect x="24" y="675" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="687" width="20" height="20" rx="3" fill="#B8C0CC" stroke="none" stroke-width="1"/><text x="80" y="704" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Excluded</text><text x="370" y="704" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Slash + Excluded label; keep provenance</text><rect x="24" y="729" width="1392" height="44" rx="6" fill="#222831" stroke="none" stroke-width="1"/><rect x="40" y="741" width="20" height="20" rx="3" fill="#F3C969" stroke="none" stroke-width="1"/><text x="80" y="758" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">Warning / error</text><text x="370" y="758" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Triangle or error icon + repair message</text><rect x="24" y="810" width="1392" height="82" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="44" y="842" fill="#205BC5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">Paper selection uses dark blue #205BC5 (6.24:1), not amber (2.18:1).</text><text x="44" y="872" fill="#404854" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Category, origin, review and inclusion are independent; a coloured mark cannot communicate all four reliably.</text></svg>