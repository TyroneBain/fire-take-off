<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Reconciliation and export proposal</title><desc id="desc">Original static proposal. Fictional project and quantities. Future capabilities are not implemented.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#101419" stroke="none" stroke-width="1"/><text x="24" y="30" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600">A / Reconcile and export — scope and blockers remain explicit</text><text x="24" y="53" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">DESIGN PROPOSAL  /  Fictional data  /  Layout and new interactions await approval</text><rect x="0" y="72" width="1440" height="856" rx="0" fill="#191D23" stroke="none" stroke-width="1"/><text x="28" y="110" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">← Back to drawing</text><text x="250" y="110" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">Harbour House / Fire takeoff</text><text x="1210" y="110" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Saved locally</text><text x="28" y="168" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600">Review &amp; export</text><text x="28" y="198" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Scope: Fire takeoff · all 24 drawings · current committed data</text><rect x="28" y="225" width="1384" height="74" rx="8" fill="#3C3020" stroke="#F3C969" stroke-width="1"/><text x="48" y="254" fill="#F3C969" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">!  3 allocated, included detections still need review</text><text x="48" y="280" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Review these included results before export. Outside-zone exclusions are listed separately below.</text><rect x="1215" y="246" width="175" height="32" rx="6" fill="#2C333E" stroke="#657386" stroke-width="1"/><text x="1225" y="267" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Review 3 results</text><text x="28" y="341" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600">Quantity reconciliation</text><text x="28" y="367" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Fictional single-item example; units are never combined into a grand total.</text><text x="44" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Item / scope</text><text x="300" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Raw instances</text><text x="460" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Included</text><text x="620" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Allocated</text><text x="795" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Source factor</text><text x="980" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Zone factor</text><text x="1195" y="412" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">Export items</text><rect x="28" y="430" width="1384" height="56" rx="6" fill="#222831" stroke="none" stroke-width="1"/><text x="44" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Sprinkler head / FP-101</text><text x="300" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">12</text><text x="460" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">10</text><text x="620" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">8</text><text x="795" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">×2</text><text x="980" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">×3</text><text x="1195" y="464" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">48</text><rect x="28" y="510" width="850" height="180" rx="8" fill="#222831" stroke="none" stroke-width="1"/><text x="48" y="540" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">Explain the difference</text><text x="48" y="574" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">12 raw − 2 excluded = 10 included instances</text><text x="48" y="602" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">10 included − 2 outside all outlines = 8 allocated instances</text><text x="48" y="630" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">8 × selection factor 2 × zone factor 3 = 48 items</text><text x="48" y="658" fill="#F3C969" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">3 allocated instances are unreviewed; these block export.</text><rect x="900" y="510" width="512" height="180" rx="8" fill="#222831" stroke="none" stroke-width="1"/><text x="920" y="540" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">Advisories</text><text x="920" y="576" fill="#F3C969" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">2 included instances omitted outside zones</text><text x="920" y="609" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Review completeness does not prove no misses.</text><text x="920" y="642" fill="#90B8FF" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">View contributing records →</text><text x="28" y="742" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">Workbook contents</text><text x="28" y="774" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Quantity schedule · drawing detail · factors · notes · provenance</text><text x="28" y="814" fill="#F2F4F7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400">Search and hidden markers do not change this export scope.</text><rect x="1125" y="809" width="287" height="42" rx="6" fill="#2C333E" stroke="#657386" stroke-width="1"/><text x="1144" y="836" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Generate XLSX — review required</text><text x="28" y="905" fill="#B8C0CC" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400">PROPOSED: linked readiness and snapshot UX. Existing server export rules must remain authoritative.</text></svg>